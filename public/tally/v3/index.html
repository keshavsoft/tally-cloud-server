<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally Portal · V3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link href="./shared/styles.css" rel="stylesheet">
</head>
<body>
    <main class="container portal-page py-5">
        <header class="mb-5">
            <p class="text-primary fw-semibold text-uppercase small mb-2">Tally · V3</p>
            <h1 class="display-5 fw-semibold mb-2">Choose a workspace</h1>
            <p class="portal-eyebrow mb-0">Company: mani9</p>
        </header>

        <div class="row g-4">
            <div class="col-12 col-md-6">
                <a class="portal-card" href="/tally/v3/units/">
                    <span class="portal-card-icon mb-4" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 5h16M4 12h16M4 19h16" />
                            <path d="M8 3v4M16 10v4M10 17v4" />
                        </svg>
                    </span>
                    <h2 class="h3">Units</h2>
                    <p class="text-secondary mb-0">Browse the units configured for this company.</p>
                </a>
            </div>
            <div class="col-12 col-md-6">
                <a class="portal-card" href="/tally/v3/batches/">
                    <span class="portal-card-icon mb-4" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z" />
                            <path d="m4.5 7.8 7.5 4.3 7.5-4.3M12 12.2V21M8 5.3l8 4.6" />
                        </svg>
                    </span>
                    <h2 class="h3">Batches</h2>
                    <p class="text-secondary mb-0">Search stock items and inspect their batch details.</p>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
