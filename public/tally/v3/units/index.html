<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Units · Tally V3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link href="../shared/styles.css" rel="stylesheet">
</head>
<body>
    <main class="container portal-page py-4 py-md-5">
        <header class="mb-4">
            <p class="text-primary fw-semibold text-uppercase small mb-2">Tally · V3</p>
            <h1 class="display-6 fw-semibold mb-1">Units</h1>
            <p class="portal-eyebrow mb-0">Company: mani9</p>
        </header>

        <p id="unitsStatus" class="portal-eyebrow" role="status" aria-live="polite">Loading units…</p>
        <div class="portal-table-wrap">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark"><tr><th scope="col">Name</th></tr></thead>
                <tbody id="unitsTableBody"></tbody>
            </table>
        </div>
    </main>

    <a class="home-button" href="/tally/v3/" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7" /><path d="M5 9v12h14V9M9 21v-7h6v7" />
        </svg>
    </a>

    <script type="module" src="./index.js"></script>
</body>
</html>
