<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Items with Batches · Tally V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body>
    <main class="container-fluid px-4 py-4">
        <header class="mb-4">
            <h1 class="mb-1">Stock Items with Batches</h1>
            <p class="text-secondary mb-0">Company: mani9</p>
        </header>

        <p id="batchesStatus" class="text-secondary" role="status" aria-live="polite">Loading stock items…</p>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Batches</th>
                    </tr>
                </thead>
                <tbody id="stockItemsTableBody"></tbody>
            </table>
        </div>
    </main>

    <div class="modal fade" id="batchModal" tabindex="-1" aria-labelledby="batchModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h2 class="modal-title fs-5" id="batchModalTitle">Batches</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th scope="col">Godown</th>
                                    <th scope="col">Batch</th>
                                    <th scope="col">Opening balance</th>
                                    <th scope="col">Opening rate</th>
                                    <th scope="col">Opening value</th>
                                </tr>
                            </thead>
                            <tbody id="batchRows"></tbody>
                        </table>
                    </div>
                    <p id="emptyBatchesMessage" class="alert alert-secondary mb-0" hidden>No batch records found.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="./index.js"></script>
</body>
</html>
