<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Units · Tally V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body>
    <main class="container py-4">
        <header class="mb-4">
            <h1 class="mb-1">Units</h1>
            <p class="text-secondary mb-0">Company: mani9</p>
        </header>

        <p id="unitsStatus" class="text-secondary" role="status" aria-live="polite">Loading units…</p>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                    <tr><th scope="col">Name</th></tr>
                </thead>
                <tbody id="unitsTableBody"></tbody>
            </table>
        </div>
    </main>
    <script type="module" src="./index.js"></script>
</body>
</html>
